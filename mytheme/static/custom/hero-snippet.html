<section class="ct-capture-hero" aria-labelledby="ct-hero-title">
  <div class="ct-hero-grid" aria-hidden="true"></div>
  <div class="ct-hero-slice ct-hero-slice--left" aria-hidden="true"></div>
  <div class="ct-hero-slice ct-hero-slice--right" aria-hidden="true"></div>

  <div class="ct-hero-copy">
    <p class="ct-hero-kicker"><span></span> The arena is live</p>
    <h1 id="ct-hero-title">Capture<br><em>the Cup</em></h1>
    <p class="ct-hero-intro">Think fast. Break clean. Take the lead.</p>
    <div class="ct-hero-actions">
      <a class="btn btn-primary ct-hero-cta" href="/challenges">Enter the arena <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
      <a class="ct-hero-secondary" href="/scoreboard">View scoreboard <i class="fas fa-chart-line" aria-hidden="true"></i></a>
    </div>
  </div>

  <div class="ct-hero-art">
    <div class="ct-hero-ring ct-hero-ring--outer" aria-hidden="true"></div>
    <div class="ct-hero-ring ct-hero-ring--inner" aria-hidden="true"></div>
    <img class="ct-hero-logo" src="/themes/mytheme/static/img/logo1.png" alt="Capture the Cup">
    <div class="ct-hero-stamp" aria-hidden="true">CTF<br><strong>2026</strong></div>
  </div>

  <div class="ct-hero-status">
    <span class="ct-status-dot"></span>
    <span>Season one</span>
    <span class="ct-status-divider"></span>
    <span>All systems ready</span>
  </div>
</section>
