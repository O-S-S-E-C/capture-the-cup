{% extends "base.html" %}

{% block content %}
  {% if request.path == "/" %}
    <div class="container-fluid px-0">
      {% include "components/capture-hero.html" %}
    </div>
  {% else %}
    <div class="container">
      {{ content | safe }}
    </div>
  {% endif %}
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/page.js") }}
{% endblock %}
